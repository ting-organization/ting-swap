<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Scripts from this site only; reads from the configured node, explorer and price source, which must be
       https or on this computer (the page checks the same). frame-ancestors cannot be set from a meta tag. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ting Swap</title>
  <meta name="description" content="Trade DLR on Ting for LTC on Litecoin, with nobody sending first.">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="js/ltc-app.js"></script>
</head>
<body class="ltc-page">
  <div class="test-band" role="note"><b>Real coins</b><span class="long">Ting and Litecoin, for real. This is new: start with small amounts.</span><span class="short">New: start with small amounts.</span></div>
  <header class="top">
    <a class="brand" href="#/"><img src="icon.svg" alt="" width="24" height="24"><span>Ting Swap <span class="brand-sub">LTC</span></span></a>
    <nav>
      <a href="#/" data-nav="market">Market</a>
      <a href="#/sell" data-nav="sell"><span class="long">Sell DLR</span><span class="short">Sell</span></a>
      <a href="#/about" data-nav="about"><span class="long">How it works</span><span class="short">About</span></a>
      <a href="#/backup" data-nav="backup">Backup</a>
    </nav>
    <button class="icon-button" id="theme" aria-label="Switch light and dark" title="Switch light and dark"></button>
  </header>
  <main id="view"><section class="notice"><span class="spinner big"></span><p class="muted">Reading both chains…</p></section></main>
  <footer class="foot">
    <span>Ting Swap · DLR ↔ LTC · your keys stay in this browser</span>
  </footer>
  <dialog id="call-dialog" aria-label="Sign with Ting ID">
    <button class="close" aria-label="Close">×</button>
    <div class="dialog-body"></div>
  </dialog>
  <dialog id="notice-dialog" aria-label="Notice">
    <button class="close" aria-label="Close">×</button>
    <div class="dialog-body"></div>
  </dialog>
  <div id="toasts" aria-live="polite"></div>
  <noscript><p class="notice">This page needs JavaScript: it reads both chains, keeps your keys and makes call links for your wallet.</p></noscript>
</body>
</html>
